# yaml-language-server: $schema=entari.schema.json
# $schema: ./entari.schema.json

basic:
  #network:
  # - type: ws
  #   host: localhost
  #   port: ${{ env.PORT }}
  ignore_self_message: true
  log:
    level: debug
    ignores:
      - httpx._client
      - httpcore._trace
      - httpcore._trace
      - aiosqlite.core
      - markdown_it.*
      - hpack.*
      - openai._base_client
      - urllib3.connectionpool
  prefix:
    - /
  schema: true
  external_dirs:
    - src
  superusers:
    qq-client:
      - ${{ env.SUPERUSER }}
    qq:
      - ${{ env.MASTER_QQ_OPENID }}
plugins:
  $prelude:
    - ::auto_reload
  .record_message:
    record_send: true
  ::echo: {}
  ::help: {}
  ::inspect: {}
  ::auto_reload:
    watch_dirs:
      - src
    watch_config: true

  entari_plugin_llm:
    skills:
      - name: satori-output
        mode: always
    models:
      - name: "deepseek/deepseek-flash"
        alias: "deepseek-flash"
        api_key: ${{ env.DEEPSEEK_API_KEY }}
        base_url: https://api.deepseek.com
        vision: true
    tools:
      ::generic: {}
      ::plugin_manager: {}
      ::image_vision: {}
      ::no_reply: {}
    memory:
      enabled: true
    group_context_limit: 20

    prompt: |
      1. 你是一个由用户提供信息并回答问题的智能助手。请根据用户提供的信息，尽可能准确和简洁地回答他们的问题。
      2. 如果信息不足以回答问题，请礼貌地告知用户需要更多信息。

  entari_plugin_llm_sticker:
    enabled: true
    auto_collect: true
    max_size_mb: 10.0

  entari_plugin_server:
    direct_adapter: true
    host: localhost
    port: ${{ env.PORT }}


adapters:
  - $path: '@onebot11.reverse'
    endpoint: ws
  - $path: '@qq.websocket'
    app_id: ${{ env.QQ_APP_ID }}
    secret: ${{ env.QQ_SECRET }}
    intent:
      guild_messages: true
      direct_message: true
      message_audit: true
      at_messages: false
      c2c_group_at_messages: true
    is_sandbox: false
