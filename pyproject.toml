[project]
name = "entari-plugin-llm-sticker"
version = "0.1.0"
description = "表情包收集、识别与发送插件，配合 entari-plugin-llm 使用"
authors = [
    {name = "RF-Tar-Railt", email = "rf_tar_railt@qq.com"},
]
dependencies = [
    "arclet-entari>=0.19.4",
    "entari-plugin-llm>=0.5.0rc4",
]
requires-python = ">=3.11, <3.16"
readme = "README.md"
license = {text = "MIT"}
keywords = ["llm", "sticker", "entari", "plugin"]

[project.urls]
Homepage = "https://github.com/ArcletProject/entari-plugin-llm-sticker"
Repository = "https://github.com/ArcletProject/entari-plugin-llm-sticker"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.ruff]
line-length = 120
target-version = "py311"
respect-gitignore = true

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "C", "T", "Q", "I"]
ignore = ["E402", "F403", "F405", "C901", "T201"]

[tool.ruff.lint.isort]
extra-standard-library = ["typing_extensions"]
force-sort-within-sections = false


[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "basic"